name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-2022

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.84.0

      - name: Cache Build Dependencies (MySQL, OpenSSL)
        uses: actions/cache@v6
        with:
          path: |
            C:\tools\mysql\current
            C:\tools\openssl\current
          key: win-deps-mysql-8.0.40-openssl-3.5.7

      - name: Setup Dependencies (MySQL, OpenSSL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 1. Set BOOST_ROOT from install-boost step
          $boostRoot = "${{ steps.install-boost.outputs.BOOST_ROOT }}"
          "BOOST_ROOT=$boostRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using Boost at $boostRoot"

          # 2. MySQL Community Server 8.0 (64-bit)
          if (-not (Test-Path 'C:\tools\mysql\current\bin\mysqld.exe')) {
              Write-Host "Downloading MySQL Server 8.0..."
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql-8.0-winx64.zip'
              curl.exe --fail -sSL --retry 3 -A "Mozilla/5.0" "https://cdn.mysql.com/archives/mysql-8.0/mysql-8.0.40-winx64.zip" -o $mysqlZip
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              $extractedDir = Get-ChildItem -Path 'C:\tools\mysql' -Directory | Where-Object { $_.Name -like 'mysql-8.0*' } | Select-Object -First 1
              Rename-Item $extractedDir.FullName 'C:\tools\mysql\current'
          }
          "MYSQL_ROOT_DIR=C:\tools\mysql\current" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # 3. FireDaemon OpenSSL 3.5.7 (64-bit)
          if (-not (Test-Path 'C:\tools\openssl\current\x64\include\openssl\opensslv.h')) {
              Write-Host "Downloading FireDaemon OpenSSL 3.5.7..."
              $opensslZip = Join-Path $env:RUNNER_TEMP 'openssl-3.5.7.zip'
              curl.exe --fail -sSL --retry 3 -A "Mozilla/5.0" "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.7.zip" -o $opensslZip
              New-Item -ItemType Directory -Force -Path 'C:\tools\openssl\current' | Out-Null
              Expand-Archive -Path $opensslZip -DestinationPath 'C:\tools\openssl\current' -Force
          }
          "OPENSSL_ROOT_DIR=C:\tools\openssl\current\x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using OpenSSL at C:\tools\openssl\current\x64"

      - name: Ensure mod-playerbots module path
        shell: pwsh
        run: |
          if (-not (Test-Path "azerothcore-wotlk/modules/mod-playerbots/src")) {
              Write-Host "Syncing mod-playerbots into azerothcore-wotlk/modules/mod-playerbots..."
              New-Item -ItemType Directory -Force -Path "azerothcore-wotlk/modules/mod-playerbots" | Out-Null
              Copy-Item -Recurse -Force "mod-playerbots/*" "azerothcore-wotlk/modules/mod-playerbots/"
          }

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          Write-Host "Release version: $ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "PACKAGE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DPACKAGE_VERSION="${{ steps.get_version.outputs.version }}" `
            -DMYSQL_ROOT_DIR="$env:MYSQL_ROOT_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DBOOST_ROOT_DIR="$env:BOOST_ROOT"

      - name: Build & Assemble Distribution
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --parallel

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --target package_zip

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $acoreSha = (git -C azerothcore-wotlk rev-parse HEAD).Trim()
          $acoreShort = $acoreSha.Substring(0, 8)
          $acoreDate = (git -C azerothcore-wotlk log -1 --format=%cs).Trim()

          $modSha = (git -C mod-playerbots rev-parse HEAD).Trim()
          $modShort = $modSha.Substring(0, 8)
          $modDate = (git -C mod-playerbots log -1 --format=%cs).Trim()

          $packageEmoji = [char]::ConvertFromUtf32(0x1F4E6)
          $rocketEmoji  = [char]::ConvertFromUtf32(0x1F680)
          $lockEmoji    = [char]::ConvertFromUtf32(0x1F512)
          $bt           = '`'
          $bt3          = '```'

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("Turnkey Windows portable distribution for AzerothCore WotLK (3.3.5a) and mod-playerbots with an automated startup orchestrator and client data downloader.")
          $lines.Add("")
          $lines.Add("### $packageEmoji Upstream Versions")
          $lines.Add("- **azerothcore-wotlk**: [$bt$acoreShort$bt](https://github.com/mod-playerbots/azerothcore-wotlk/commit/$acoreSha) (${bt}Playerbot${bt} branch, $acoreDate)")
          $lines.Add("- **mod-playerbots**: [$bt$modShort$bt](https://github.com/mod-playerbots/mod-playerbots/commit/$modSha) (${bt}master${bt} branch, $modDate)")
          $lines.Add("")
          $lines.Add("### $rocketEmoji Quick Start")
          $lines.Add("1. Download and extract **${bt}mod-playerbots-portable-$ver.zip${bt}** from the Assets below.")
          $lines.Add("2. Run **${bt}startup.exe${bt}** (on first run, required client data and database will be initialized automatically).")
          $lines.Add("3. Set realmlist to ${bt}set realmlist 127.0.0.1${bt} and create an account via the server console:")
          $lines.Add("   ${bt3}text")
          $lines.Add("   account create <username> <password>")
          $lines.Add("   account set gmlevel <username> 3 -1")
          $lines.Add("   ${bt3}")
          $lines.Add("")
          $lines.Add("### $lockEmoji SHA-256 Checksums")
          $lines.Add("| File | SHA-256 Checksum |")
          $lines.Add("| :--- | :--- |")
          Get-ChildItem -Path output -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              $lines.Add("| ${bt}$($_.Name)${bt} | ${bt}$hash${bt} |")
          }

          $notes = $lines -join "`n"
          [System.IO.File]::WriteAllText("release_notes.md", $notes, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Generated release notes:"
          Write-Host $notes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: false
          draft: false
          files: |
            output/*.zip
